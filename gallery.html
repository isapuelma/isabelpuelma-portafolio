<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Title Optimizado para Búsqueda de Servicios -->
    <title>Proyectos de Diseño | Isabel Puelma — Branding, Web UI/UX & Packaging</title>

    <!-- SEO Canónico y Metadatos -->
    <meta name="description" content="Explora el archivo completo de proyectos de Isabel Puelma. Casos de estudio en diseño de identidad visual, desarrollo web e-commerce, empaques e ilustración.">
    <meta name="keywords" content="Portafolio de Diseño, Proyectos Branding, Diseño Web Chile, UI UX Portfolio, Packaging Design, Ilustración Corporativa, Isabel Puelma">
    <meta name="author" content="Isabel Puelma">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://isabelpuelma.cl/gallery.html">

    <!-- Favicon -->
    <link rel="icon" href="isa.svg" type="image/svg+xml">

    <!-- Open Graph / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://isabelpuelma.cl/gallery.html">
    <meta property="og:title" content="Proyectos de Diseño | Isabel Puelma Studio">
    <meta property="og:description" content="Archivo seleccionado de proyectos de branding, plataformas web, packaging e ilustración estratégica.">
    <meta property="og:image" content="https://isabelpuelma.cl/assets/og-cover.jpg">
    <meta property="og:locale" content="es_CL">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Proyectos de Diseño | Isabel Puelma">
    <meta name="twitter:description" content="Explora los proyectos de estrategia de marca, sitios web e-commerce y empaques desarrollados por Isabel Puelma.">
    <meta name="twitter:image" content="https://isabelpuelma.cl/assets/og-cover.jpg">

    <!-- Preconnect & Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web" defer></script>

    <!-- Datos Estructurados JSON-LD (Schema.org) para Colección de Trabajos -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Proyectos de Diseño — Isabel Puelma Studio",
      "url": "https://isabelpuelma.cl/gallery.html",
      "description": "Galería y archivo de proyectos de branding, diseño web, desarrollo e-commerce y packaging.",
      "author": {
        "@type": "Person",
        "name": "Isabel Puelma",
        "jobTitle": "Diseñadora Estratégica",
        "url": "https://isabelpuelma.cl"
      },
      "about": [
        {"@type": "Thing", "name": "Branding & Identidad Visual"},
        {"@type": "Thing", "name": "Diseño Web & E-Commerce"},
        {"@type": "Thing", "name": "Packaging & Empaques"},
        {"@type": "Thing", "name": "Ilustración"}
      ]
    }
    </script>
</head>
<body>
    <!-- Capas Premium -->
    <div class="page-overlay" aria-hidden="true"></div>
    <div class="cursor-dot" aria-hidden="true"></div>
    <div class="cursor-outline" aria-hidden="true"></div>

    <!-- Header Fino -->
    <header class="header" role="banner">
        <a href="index.html" class="brand-name" aria-label="Inicio Isabel Puelma Studio">
            <img src="isabelpuelma.svg" alt="Logo Isabel Puelma - Diseñadora Estratégica">
        </a>
        <nav class="nav-menu" aria-label="Navegación principal">
            <a href="gallery.html" class="nav-link active" aria-current="page">Proyectos</a>
            <a href="about.html" class="nav-link">Sobre Mí</a>
        </nav>
        <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="mobileNav">
            <span></span><span></span><span></span>
        </button>
    </header>
    
    <!-- Navegación Móvil -->
    <nav class="mobile-nav-overlay" id="mobileNav" aria-label="Navegación móvil">
        <a href="index.html" class="mobile-link text-h2">Inicio</a>
        <a href="gallery.html" class="mobile-link text-h2">Proyectos</a>
        <a href="about.html" class="mobile-link text-h2">Sobre Mí</a>
    </nav>

    <main id="main-content">
        <!-- ENCABEZADO Y FILTROS -->
        <section class="bento-grid" style="border-top:none;" aria-label="Filtros de Portafolio">
            <div class="cell col-span-12 reveal-element" style="padding-top: 10rem; padding-bottom: 2rem;">
                <h1 class="text-display">Proyectos.</h1>
            </div>
            
            <div class="cell col-span-12 reveal-element" style="padding: 1.5rem var(--spacing-margin); border-bottom: 1px solid var(--grid-line-color);">
            <div class="filter-bar-wrapper" role="toolbar" aria-label="Filtrar proyectos por categoría">
        <!-- Izquierda: Filtros Tradicionales -->
        <div class="filter-container">
            <button class="filter-btn active text-mono" data-filter="all">Todo</button>
            <button class="filter-btn text-mono" data-filter="branding">Branding</button>
            <button class="filter-btn text-mono" data-filter="web">Web</button>
            <button class="filter-btn text-mono" data-filter="packaging">Packaging</button>
            <button class="filter-btn text-mono" data-filter="ilustración">Ilustración</button>
        </div>
    </div>
</div>

        </section>

        <!-- GRILLA DINÁMICA -->
        <section class="gallery-grid-section-variable" id="portfolio-grid" aria-label="Galería de proyectos" style="min-height: 80vh; background: var(--color-bg);">
            <!-- Inyección dinámica mediante JS -->
        </section>
    </main>

      <!-- FOOTER EDITORIAL -->
    <footer class="footer-container reveal-element" role="contentinfo">
        <div class="footer-main">
            <div class="footer-cta-header">
                <p class="footer-subtext text-mono">¿Tienes un proyecto en mente?</p>
            </div>

            <div class="footer-email-wrap">
                <a href="mailto:mipuelma@uc.cl" class="text-display footer-email-link" onclick="copyEmailOnly(event)" aria-label="Copiar correo electrónico de contacto">
                    <span class="email-text">mipuelma@uc.cl</span>
                </a>
            </div>
        </div>

        <div class="footer-bottom-row">
            <!-- Hora Local -->
            <div class="footer-col-time text-mono">
                <span id="santiagoTime">SANTIAGO DE CHILE — --:--</span>
            </div>

            <!-- Redes Sociales -->
            <div class="footer-social-links">
                <a href="https://www.instagram.com/isa_puelma/" target="_blank" rel="noopener" class="text-mono">INSTAGRAM ↗</a>
                <a href="https://www.behance.net/isabelpuelma" target="_blank" rel="noopener" class="text-mono">BEHANCE↗</a>
                <a href="https://www.linkedin.com/in/isabel-puelma/" target="_blank" rel="noopener" class="text-mono">LINKEDIN ↗</a>
            </div>

            <!-- Copyright -->
            <div class="footer-copyright-wrap">
                <span class="text-mono copyright-text">© 2026 ISABEL PUELMA STUDIO</span>
            </div>
        </div>
    </footer>

    <!-- NOTIFICACIÓN EMERGENTE (TOAST) -->
    <div id="toast-notification" class="toast-notification text-mono" aria-hidden="true" role="status">
        <i class="ph ph-check-circle" style="color: #22c55e; font-size: 1.1rem;"></i>
        <span>¡Correo copiado al portapapeles!</span>
    </div>

    <!-- Librerías con defer -->
    <script src="https://unpkg.com/lenis@1.1.5/dist/lenis.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- JS de la App -->
    <script src="data.js"></script>
    <script src="portafolio.js"></script>
</body>
</html>
